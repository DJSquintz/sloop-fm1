
name: FM-1 Build Check

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Verify source files
        run: |
          test -f build.sh
          test -f BUILDING.md
          test -f tests/run_tests.sh

      - name: Run SLOOP tests
        run: |
          bash tests/run_tests.sh
